<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Stackly Consulting</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
  <style>
    body {
      background-color: var(--color-navy);
      background-image: linear-gradient(rgba(11, 19, 43, 0.8), rgba(11, 19, 43, 0.95)), url('consulting_hero_bg_1786435771395.jpg');
      background-size: cover;
      background-position: center;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      color: var(--color-white);
    }
    .auth-container {
      background: rgba(11, 19, 43, 0.6);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      padding: 3rem;
      width: 100%;
      max-width: 450px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.5);
    }
    .auth-header {
      text-align: center;
      margin-bottom: 2rem;
    }
    .auth-header h2 {
      font-size: 2rem;
      margin-bottom: 0.5rem;
      font-family: var(--font-serif);
    }
    .auth-header p {
      color: var(--color-text-muted);
      font-size: 0.95rem;
    }
    .form-group {
      margin-bottom: 1.5rem;
      position: relative;
    }
    .form-group label {
      display: block;
      margin-bottom: 0.5rem;
      font-size: 0.9rem;
      color: rgba(255, 255, 255, 0.9);
    }
    .form-control, .form-select {
      width: 100%;
      padding: 0.8rem 1rem;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 6px;
      color: var(--color-white);
      font-family: var(--font-sans);
      font-size: 1rem;
      transition: all 0.3s ease;
      box-sizing: border-box;
    }
    .form-select {
      appearance: none;
      background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='white' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
      background-repeat: no-repeat;
      background-position: right 1rem center;
      background-size: 1em;
    }
    .form-control:focus, .form-select:focus {
      outline: none;
      border-color: var(--color-gold);
      background: rgba(255, 255, 255, 0.1);
    }
    /* Fix for dark options in select */
    .form-select option {
      background-color: var(--color-navy);
      color: var(--color-white);
    }
    .btn-auth {
      width: 100%;
      padding: 1rem;
      background-color: var(--color-gold);
      color: var(--color-navy);
      border: none;
      border-radius: 6px;
      font-weight: 600;
      font-size: 1rem;
      cursor: pointer;
      transition: all 0.3s ease;
      margin-top: 1rem;
    }
    .btn-auth:hover {
      background-color: var(--color-white);
      transform: translateY(-2px);
    }
    .auth-footer {
      text-align: center;
      margin-top: 2rem;
      font-size: 0.9rem;
      color: var(--color-text-muted);
    }
    .auth-footer a {
      color: var(--color-gold);
      text-decoration: none;
      font-weight: 500;
    }
    .auth-footer a:hover {
      text-decoration: underline;
    }
    .error-message {
      color: #ef4444;
      font-size: 0.85rem;
      margin-top: 0.4rem;
      display: none;
    }
  </style>
</head>
<body>

  <!-- Custom Cursor -->
  <div class="cursor-dot"></div>
  <div class="cursor-outline"></div>

  <div class="auth-container">
    <div class="auth-header">
      <img src="assets/logo.webp" alt="Logo" style="height: 40px; margin-bottom: 1rem;">
      <h2>Welcome Back</h2>
      <p>Sign in to your dashboard.</p>
    </div>

    <form id="loginForm">
      <div class="form-group">
        <label for="email">Email Address</label>
        <input type="email" id="email" class="form-control" placeholder="john@example.com">
        <div class="error-message" id="emailError">Please enter a valid email address.</div>
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" class="form-control" placeholder="••••••••">
        <div class="error-message" id="pwdError">Please enter your password.</div>
      </div>
      
      <div class="form-group">
        <label for="role">Select Dashboard Role</label>
        <select id="role" class="form-select">
          <option value="client">Client Portal</option>
          <option value="admin">Consultant / Admin</option>
        </select>
      </div>
      
      <button type="submit" class="btn-auth">Sign In</button>
    </form>

    <div class="auth-footer">
      Don't have an account? <a href="signup.html">Register here</a>
    </div>
  </div>

  <script>
    // Pre-fill email from registration if available
    const savedEmail = localStorage.getItem('registeredEmail');
    if (savedEmail) {
      document.getElementById('email').value = savedEmail;
    }

    document.getElementById('loginForm').addEventListener('submit', function(e) {
      e.preventDefault();
      
      // Reset errors
      document.querySelectorAll('.error-message').forEach(el => el.style.display = 'none');
      
      let isValid = true;
      const email = document.getElementById('email').value.trim();
      const pwd = document.getElementById('password').value;
      const role = document.getElementById('role').value;

      const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
      if (!email || !emailRegex.test(email)) {
        document.getElementById('emailError').style.display = 'block';
        isValid = false;
      }

      if (!pwd) {
        document.getElementById('pwdError').style.display = 'block';
        isValid = false;
      }

      if (isValid) {
        // Change button state
        const btn = document.querySelector('.btn-auth');
        btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Authenticating...';
        
        setTimeout(() => {
          if (role === 'admin') {
            window.location.href = 'dashboard_admin.html';
          } else {
            window.location.href = 'dashboard_client.html';
          }
        }, 800);
      }
    });

    // Custom Cursor Logic
    const cursorDot = document.querySelector('.cursor-dot');
    const cursorOutline = document.querySelector('.cursor-outline');
    if (cursorDot && cursorOutline) {
      window.addEventListener('mousemove', (e) => {
        const posX = e.clientX;
        const posY = e.clientY;
        cursorDot.style.left = `${posX}px`;
        cursorDot.style.top = `${posY}px`;
        gsap.to(cursorOutline, {
          x: posX,
          y: posY,
          duration: 0.15,
          ease: 'power2.out'
        });
      });
      const clickables = document.querySelectorAll('a, button, input, select');
      clickables.forEach(el => {
        el.addEventListener('mouseenter', () => cursorOutline.classList.add('hovering'));
        el.addEventListener('mouseleave', () => cursorOutline.classList.remove('hovering'));
      });
    }
  </script>
</body>
</html>
