<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 - Page Not Found</title>
  <link rel="stylesheet" href="styles.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/vanta@latest/dist/vanta.globe.min.js"></script>
  <script src="https://unpkg.com/@studio-freight/lenis@1.0.39/dist/lenis.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
  <style>
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: var(--color-navy);
    }
    #vanta-404 {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100vh;
      z-index: 0;
    }
    .content-404 {
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      text-align: center;
      color: var(--color-white);
      z-index: 1;
      pointer-events: none;
    }
    .content-404 h1 {
      font-size: 10rem;
      margin-bottom: 0;
      text-shadow: 0 10px 40px rgba(0,0,0,0.5);
      line-height: 1;
      font-family: var(--font-serif);
    }
    .content-404 p {
      font-size: 1.5rem;
      margin-top: 1rem;
      margin-bottom: 3rem;
      color: rgba(255, 255, 255, 0.8);
      font-family: var(--font-sans);
    }
    .btn-404 {
      pointer-events: auto;
      background-color: var(--color-gold);
      color: var(--color-navy);
      padding: 1rem 2rem;
      border-radius: 4px;
      text-decoration: none;
      font-weight: 600;
      font-family: var(--font-sans);
      transition: all 0.3s ease;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .btn-404:hover {
      background-color: var(--color-white);
      transform: translateY(-3px);
      box-shadow: 0 10px 20px rgba(0,0,0,0.3);
    }
  </style>
</head>
<body>
  <!-- Custom Cursor -->
  <div class="cursor-dot"></div>
  <div class="cursor-outline"></div>

  <div id="vanta-404"></div>
  <div class="content-404">
    <h1>404</h1>
    <p>The page you are looking for is lost in the data.</p>
    <div style="display: flex; gap: 1rem; justify-content: center; pointer-events: auto;">
      <button onclick="history.back()" class="btn-404" style="background-color: transparent; border: 2px solid var(--color-gold); color: var(--color-gold);">Go Back</button>
      <a href="index.html" class="btn-404">Back to Home</a>
    </div>
  </div>

  <script>
    if (window.VANTA) {
      window.VANTA.GLOBE({
        el: "#vanta-404",
        mouseControls: true,
        touchControls: true,
        gyroControls: false,
        minHeight: 200.00,
        minWidth: 200.00,
        scale: 1.00,
        scaleMobile: 1.00,
        color: 0xc8a97e,
        color2: 0x10b981,
        backgroundColor: 0x0b132b,
        size: 1.20
      });
    }

    // Custom Cursor Logic
    const cursorDot = document.querySelector('.cursor-dot');
    const cursorOutline = document.querySelector('.cursor-outline');

    if (cursorDot && cursorOutline) {
      window.addEventListener('mousemove', (e) => {
        const posX = e.clientX;
        const posY = e.clientY;

        cursorDot.style.left = `${posX}px`;
        cursorDot.style.top = `${posY}px`;

        gsap.to(cursorOutline, {
          x: posX,
          y: posY,
          duration: 0.15,
          ease: 'power2.out'
        });
      });

      const clickables = document.querySelectorAll('a, button, .card-button, .card-button-dark');
      clickables.forEach(el => {
        el.addEventListener('mouseenter', () => {
          cursorOutline.classList.add('hovering');
        });
        el.addEventListener('mouseleave', () => {
          cursorOutline.classList.remove('hovering');
        });
      });
    }
  </script>
</body>
</html>
